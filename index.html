<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fiambrería - Fila Virtual</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #eab308;
            --danger: #dc2626;
            --background: #f8fafc;
            --text: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Corrección para Safari iOS */
            min-height: 100vh;
            min-height: 100dvh; 
            padding: 20px;
            text-align: center;
            /* Previene el rebote al hacer scroll en iOS */
            overscroll-behavior-y: none; 
        }

        .app-container {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            overflow: hidden;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .subtitle { color: #64748b; margin-bottom: 30px; font-size: 1.1rem; }
        
        .big-number {
            font-size: 5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            /* Evita el doble tap para zoom en iOS */
            touch-action: manipulation; 
        }
        
        .btn:active { transform: scale(0.98); }
        .btn-danger { background-color: transparent; color: var(--danger); margin-top: 15px; padding: 10px; }

        .status-box {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .status-box p { margin: 5px 0; font-size: 1.1rem; }
        .highlight { font-weight: bold; color: var(--primary); }

        #alert-screen {
            background-color: var(--warning);
            color: #000;
            border-radius: 20px;
            padding: 40px 20px;
        }
        #alert-screen h1 { font-size: 2.5rem; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Fiambrería</h1>
            <p class="subtitle">Fila Virtual</p>
            <div style="margin: 40px 0;">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #2563eb;">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
            </div>
            <button class="btn" onclick="requestNumber()">OBTENER MI NÚMERO</button>
        </div>

        <div id="waiting-screen" class="screen">
            <p class="subtitle">Tu número es</p>
            <div class="big-number" id="my-number">--</div>
            
            <div class="status-box">
                <p>Atendiendo: <span class="highlight" id="current-number">--</span></p>
                <p>Personas adelante: <span class="highlight" id="people-ahead">--</span></p>
            </div>
            
            <p style="color: #64748b;">Tiempo estimado: <span id="est-time" style="font-weight: bold; color: #0f172a;">-- min</span></p>
            
            <button class="btn btn-danger" onclick="cancelNumber()">Cancelar mi turno</button>
        </div>

        <div id="alert-screen" class="screen">
            <h1>¡Prepárate!</h1>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">Tu turno está a punto de ser llamado.</p>
            <p style="font-size: 1.1rem; margin-bottom: 30px;">Por favor, acércate a la sección.</p>
            <button class="btn" style="background-color: #000; color: #fff;" onclick="resetApp()">Entendido</button>
        </div>

    </div>

    <script>
        let wakeLock = null;
        let simulationInterval = null;
        let audioContext = null;
        let myNumberInt = 0;
        let currentNumberInt = 0;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Inicializar el contexto de audio (iOS requiere que esto pase en un evento de clic)
        function initAudio() {
            if (!audioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioContext = new AudioContext();
                }
            }
            // En iOS, reproducir un sonido vacío desbloquea el audio para después
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Función para el sonido de alerta (Alternativa a la vibración en iOS)
        function playBeep() {
            if (audioContext) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioContext.currentTime); // Tono agradable
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime); // Volumen suave
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.3); // Dura 0.3 segundos
            }
        }

        // Solicitar Wake Lock con fallback seguro
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock activado con éxito');
                }
            } catch (err) {
                console.warn('iOS/Navegador bloqueó el Wake Lock (Modo ahorro de energía o sin HTTPS):', err.message);
                // La app sigue funcionando aunque no se pueda mantener la pantalla encendida
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        function requestNumber() {
            initAudio(); // Desbloqueamos el audio en iOS
            
            myNumberInt = 14; 
            currentNumberInt = 9;
            let peopleAhead = myNumberInt - currentNumberInt;
            
            document.getElementById('my-number').innerText = `C-${myNumberInt}`;
            document.getElementById('current-number').innerText = `C-0${currentNumberInt}`;
            document.getElementById('people-ahead').innerText = peopleAhead;
            document.getElementById('est-time').innerText = peopleAhead * 2;

            showScreen('waiting-screen');
            requestWakeLock();
            startSimulation();
        }

        function startSimulation() {
            simulationInterval = setInterval(() => {
                currentNumberInt++;
                let peopleAhead = myNumberInt - currentNumberInt;
                
                let displayCurrent = currentNumberInt < 10 ? `C-0${currentNumberInt}` : `C-${currentNumberInt}`;
                document.getElementById('current-number').innerText = displayCurrent;
                document.getElementById('people-ahead').innerText = peopleAhead;
                document.getElementById('est-time').innerText = peopleAhead * 2;

                if (peopleAhead <= 2 && peopleAhead > 0) {
                    clearInterval(simulationInterval);
                    triggerAlert();
                }
            }, 4000); 
        }

        function triggerAlert() {
            showScreen('alert-screen');
            
            // Intenta vibrar (Funciona en Android)
            if ('vibrate' in navigator) {
                try { navigator.vibrate([500, 200, 500]); } catch(e){}
            }
            
            // Emite un sonido (Funciona en iOS y Android)
            playBeep();
            
            // Repetir el sonido 2 veces más para llamar la atención
            setTimeout(playBeep, 500);
            setTimeout(playBeep, 1000);
        }

        function cancelNumber() {
            resetApp();
        }

        function resetApp() {
            clearInterval(simulationInterval);
            releaseWakeLock();
            showScreen('welcome-screen');
        }
    </script>
</body>
</html>
