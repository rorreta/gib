<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiambrería - Fila Virtual</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #eab308;
            --danger: #dc2626;
            --background: #f8fafc;
            --text: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Contenedor principal estilo móvil */
        .app-container {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            overflow: hidden;
        }

        /* Control de pantallas */
        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tipografía y Botones */
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .subtitle { color: #64748b; margin-bottom: 30px; font-size: 1.1rem; }
        
        .big-number {
            font-size: 5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        
        .btn:active { transform: scale(0.98); }
        .btn-danger { background-color: transparent; color: var(--danger); margin-top: 15px; padding: 10px; }

        /* Elementos de la sala de espera */
        .status-box {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .status-box p { margin: 5px 0; font-size: 1.1rem; }
        .highlight { font-weight: bold; color: var(--primary); }

        /* Pantalla de alerta */
        #alert-screen {
            background-color: var(--warning);
            color: #000;
            border-radius: 20px;
            padding: 40px 20px;
        }
        #alert-screen h1 { font-size: 2.5rem; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Fiambrería</h1>
            <p class="subtitle">Supermercado</p>
            <div style="margin: 40px 0;">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #2563eb;">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
            </div>
            <button class="btn" onclick="requestNumber()">OBTENER MI NÚMERO</button>
        </div>

        <div id="waiting-screen" class="screen">
            <p class="subtitle">Tu número es</p>
            <div class="big-number" id="my-number">--</div>
            
            <div class="status-box">
                <p>Atendiendo ahora: <span class="highlight" id="current-number">--</span></p>
                <p>Personas adelante: <span class="highlight" id="people-ahead">--</span></p>
            </div>
            
            <p style="color: #64748b;">Tiempo estimado: <span id="est-time" style="font-weight: bold; color: #0f172a;">-- min</span></p>
            
            <button class="btn btn-danger" onclick="cancelNumber()">Cancelar mi turno</button>
        </div>

        <div id="alert-screen" class="screen">
            <h1>¡Prepárate!</h1>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">Tu turno está a punto de ser llamado.</p>
            <p style="font-size: 1.1rem; margin-bottom: 30px;">Por favor, acércate al mesón de la fiambrería.</p>
            <button class="btn" style="background-color: #000; color: #fff;" onclick="resetApp()">Entendido</button>
        </div>

    </div>

    <script>
        // Variables de estado
        let wakeLock = null;
        let simulationInterval = null;
        let myNumberInt = 0;
        let currentNumberInt = 0;

        // Cambiar entre pantallas
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Función para solicitar Wake Lock (Mantiene la pantalla encendida)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Pantalla mantenida encendida activa');
                }
            } catch (err) {
                console.error(`Error de Wake Lock: ${err.name}, ${err.message}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // 1. Acción: Obtener Número
        function requestNumber() {
            // Aquí iría el fetch() tipo POST hacia tu backend
            // Ejemplo: fetch('/api/queue/join', { method: 'POST' })
            
            // Simulamos la respuesta del servidor
            myNumberInt = 14; 
            currentNumberInt = 9;
            let peopleAhead = myNumberInt - currentNumberInt;
            
            document.getElementById('my-number').innerText = `C-${myNumberInt}`;
            document.getElementById('current-number').innerText = `C-0${currentNumberInt}`;
            document.getElementById('people-ahead').innerText = peopleAhead;
            document.getElementById('est-time').innerText = peopleAhead * 2; // Asumimos 2 min por persona

            showScreen('waiting-screen');
            requestWakeLock();
            
            // Iniciamos una simulación para que veas cómo avanza la cola
            startSimulation();
        }

        // Simulación de avance de la cola (Reemplaza los WebSockets/Polling)
        function startSimulation() {
            simulationInterval = setInterval(() => {
                currentNumberInt++;
                let peopleAhead = myNumberInt - currentNumberInt;
                
                // Actualizar UI
                document.getElementById('current-number').innerText = currentNumberInt < 10 ? `C-0${currentNumberInt}` : `C-${currentNumberInt}`;
                document.getElementById('people-ahead').innerText = peopleAhead;
                document.getElementById('est-time').innerText = peopleAhead * 2;

                // Lógica de alerta (Cuando quedan 2 personas o menos)
                if (peopleAhead <= 2 && peopleAhead > 0) {
                    clearInterval(simulationInterval);
                    triggerAlert();
                }
            }, 4000); // Avanza un número cada 4 segundos para la demo
        }

        // 2. Acción: Disparar Alerta
        function triggerAlert() {
            showScreen('alert-screen');
            // Intentar vibrar si el móvil lo permite
            if ('vibrate' in navigator) {
                navigator.vibrate([500, 200, 500, 200, 500]);
            }
        }

        // 3. Acción: Cancelar o Reiniciar
        function cancelNumber() {
            // Aquí iría el fetch() tipo DELETE hacia tu backend
            resetApp();
        }

        function resetApp() {
            clearInterval(simulationInterval);
            releaseWakeLock();
            showScreen('welcome-screen');
        }
    </script>
</body>
</html>
